name: 24/7 Production Engine (Lavalink + Bot Fleet)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: 247-production-engine-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  production-engine:
    name: 24/7 Unified Runner (Lavalink + Discord Music Bot Fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_TOKENS: ${{ secrets.DISCORD_TOKENS }}
      DISCORD_TOKEN_2: ${{ secrets.DISCORD_TOKEN_2 }}
      DISCORD_TOKEN_3: ${{ secrets.DISCORD_TOKEN_3 }}
      DISCORD_TOKEN_4: ${{ secrets.DISCORD_TOKEN_4 }}
      ALL_BOT_IDS: ${{ secrets.ALL_BOT_IDS }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_ID_2: ${{ secrets.CLIENT_ID_2 }}
      CLIENT_ID_3: ${{ secrets.CLIENT_ID_3 }}
      CLIENT_ID_4: ${{ secrets.CLIENT_ID_4 }}
      GUILD_ID: ${{ secrets.GUILD_ID }}
      NODE_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}

    steps:
      # ========================================================================
      # 1. INITIALIZATION & RUNTIMES
      # ========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java 25 LTS (Lavalink)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Node.js 20.x LTS (Music Bot)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ========================================================================
      # 2. LAVALINK BUILD & CONFIGURATION
      # ========================================================================
      - name: Restore Lavalink.jar Cache
        id: jar-cache
        uses: actions/cache@v5
        with:
          path: Lavalink.jar
          key: lavalink-jar-${{ runner.os }}-${{ vars.LAVALINK_KOE_REF || 'f7335760359f2386cab23eefe66284177f969ff5' }}

      - name: Set Cached Lavalink Env
        if: steps.jar-cache.outputs.cache-hit == 'true'
        run: |
          echo "KOE_LABEL=koe 3.1.0 (cached build, DAVE send-path fix)" >> "$GITHUB_ENV"
          ls -lh Lavalink.jar

      - name: Restore Gradle Cache (Lavalink koe build)
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lavalink-koe-gradle-${{ runner.os }}-${{ vars.LAVALINK_KOE_REF || 'f7335760359f2386cab23eefe66284177f969ff5' }}

      - name: Build Lavalink with koe 3.1.0 (DAVE send-path fix)
        if: steps.jar-cache.outputs.cache-hit != 'true'
        id: koe-build
        continue-on-error: true
        timeout-minutes: 25
        env:
          KOE_REF: ${{ vars.LAVALINK_KOE_REF || 'f7335760359f2386cab23eefe66284177f969ff5' }}
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/lavalink-koe"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          git init -q "$WORK"
          cd "$WORK"
          git remote add origin https://github.com/alula/Lavalink.git
          if ! git fetch -q --depth 1 origin "$KOE_REF"; then
            if ! git fetch -q --depth 1 origin koe-perf; then
              echo "::warning::Could not fetch koe-perf ($KOE_REF); falling back to upstream image."
              exit 0
            fi
          fi
          git checkout -q FETCH_HEAD
          KOE_PIN=$(grep -oE 'version\("koe", "[^"]+"' settings.gradle.kts | head -1 || true)
          echo "Building commit $(git rev-parse --short HEAD) - ${KOE_PIN:-koe version unknown}"
          chmod +x ./gradlew
          if ! ./gradlew --no-daemon --console=plain :Lavalink-Server:bootJar; then
            echo "::warning::Gradle build of koe 3.1.0 node failed; falling back to upstream image."
            exit 0
          fi
          JAR=$(ls -1 LavalinkServer/build/libs/*.jar 2>/dev/null | grep -v -- '-plain' | head -1 || true)
          if [ -z "$JAR" ]; then
            echo "::warning::Gradle produced no jar; falling back to upstream image."
            exit 0
          fi
          cp "$JAR" "$GITHUB_WORKSPACE/Lavalink.jar"
          ls -lh "$GITHUB_WORKSPACE/Lavalink.jar"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "KOE_LABEL=koe 3.1.0 (self-built, DAVE send-path fix)" >> "$GITHUB_ENV"

      - name: Download Upstream Lavalink Node Build (fallback)
        if: steps.jar-cache.outputs.cache-hit != 'true' && steps.koe-build.outputs.built != 'true'
        id: lavalink-image
        env:
          LAVALINK_IMAGE: ${{ vars.LAVALINK_IMAGE || 'ghcr.io/lavalink-devs/lavalink:dev' }}
        run: |
          set -euo pipefail
          echo "Pulling $LAVALINK_IMAGE ..."
          docker pull "$LAVALINK_IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$LAVALINK_IMAGE" 2>/dev/null \
            || docker inspect --format '{{.Id}}' "$LAVALINK_IMAGE")
          echo "image=$LAVALINK_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $DIGEST"
          echo "KOE_LABEL=koe 3.0.0 (upstream image fallback - DAVE send-path stall possible)" >> "$GITHUB_ENV"

          docker rm -f lavalink-extract >/dev/null 2>&1 || true
          docker create --name lavalink-extract "$LAVALINK_IMAGE" >/dev/null
          JAR_PATH=""
          for CANDIDATE in /opt/Lavalink/Lavalink.jar /app/Lavalink.jar /Lavalink.jar; do
            if docker cp "lavalink-extract:$CANDIDATE" ./Lavalink.jar 2>/dev/null; then
              JAR_PATH="$CANDIDATE"
              break
            fi
          done
          docker rm lavalink-extract >/dev/null
          test -n "$JAR_PATH" || { echo "::error::No Lavalink.jar found in $LAVALINK_IMAGE"; exit 1; }
          echo "jar=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Extracted $JAR_PATH"
          ls -lh Lavalink.jar
          test "$(wc -c < Lavalink.jar)" -gt 10000000 || { echo "::error::Extracted Lavalink.jar looks invalid"; exit 1; }

      - name: Log Lavalink Build Identity (koe / libdave / jar)
        env:
          IMAGE: ${{ steps.lavalink-image.outputs.image }}
          DIGEST: ${{ steps.lavalink-image.outputs.digest }}
        run: |
          set -uo pipefail
          JAR_SHA=$(sha256sum Lavalink.jar | cut -d' ' -f1)
          JAR_BYTES=$(wc -c < Lavalink.jar)
          KOE_VERSION=$(javap -constants -cp Lavalink.jar moe.kyokobot.koe.Koe 2>/dev/null \
            | grep -oiE 'VERSION[^=]*= *"[^"]+"' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          DAVE_VERSION=$(javap -constants -cp Lavalink.jar moe.kyokobot.libdave.NativeDave 2>/dev/null \
            | grep -oiE 'VERSION[^=]*= *"[^"]+"' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          JAR_ENTRIES=$( { unzip -l Lavalink.jar 2>/dev/null || jar tf Lavalink.jar 2>/dev/null; } \
            | grep -ci 'libdave' | tr -dc '0-9' || true )
          JAR_ENTRIES=${JAR_ENTRIES:-0}
          if [ -n "${IMAGE:-}" ]; then
            FS_ENTRIES=$(docker run --rm --entrypoint sh "$IMAGE" -c \
              'find /opt/Lavalink /app -iname "*libdave*" 2>/dev/null' 2>/dev/null \
              | grep -c . | tr -dc '0-9' || true)
          else
            FS_ENTRIES=0
          fi
          FS_ENTRIES=${FS_ENTRIES:-0}
          DAVE_NATIVES=$((10#${JAR_ENTRIES} + 10#${FS_ENTRIES}))
          MANIFEST=$(unzip -p Lavalink.jar META-INF/MANIFEST.MF 2>/dev/null | tr -d '\r' \
            | grep -iE '^(Implementation-Version|Lavaplayer-Version):' | tr '\n' ' ' || true)

          echo "koe source      : ${KOE_LABEL:-unknown}"
          echo "image           : ${IMAGE:-self-built (koe-perf)}"
          echo "image digest    : ${DIGEST:-n/a}"
          echo "jar sha256      : ${JAR_SHA}"
          echo "jar size        : ${JAR_BYTES} bytes"
          echo "koe version     : ${KOE_VERSION:-unavailable (no VERSION constant)}"
          echo "libdave version : ${DAVE_VERSION:-unavailable (no VERSION constant)}"
          echo "libdave entries : ${DAVE_NATIVES} (jar ${JAR_ENTRIES}, image ${FS_ENTRIES})"
          echo "manifest        : ${MANIFEST:-none}"

          {
            echo "## Lavalink node build"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE:-self-built (koe-perf)}\` |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo "| Jar sha256 | \`${JAR_SHA}\` |"
            echo "| koe | \`${KOE_VERSION:-unknown}\` |"
            echo "| libdave | \`${DAVE_VERSION:-unknown}\` (${DAVE_NATIVES} entries: ${JAR_ENTRIES} jar, ${FS_ENTRIES} image) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure application.yml
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          SP_DC_COOKIE: ${{ secrets.SPOTIFY_SP_DC || '' }}
        run: |
          if [ ! -f "application.yml" ]; then
            cp application.example.yml application.yml
          fi
          sed -i "s|password: .*|password: \"${NODE_PASSWORD}\"|g" application.yml
          if [ -n "$YT_REFRESH_TOKEN" ]; then
            sed -i "/oauth:/,/refreshToken:/ s/enabled: false/enabled: true/" application.yml
            sed -i "/oauth:/,/refreshToken:/ s/skipInitialization: false/skipInitialization: true/" application.yml
            sed -i "s|refreshToken: .*|refreshToken: \"${YT_REFRESH_TOKEN}\"|g" application.yml
          fi
          if [ -n "$SP_DC_COOKIE" ]; then
            sed -i "s|spDc: .*|spDc: \"${SP_DC_COOKIE}\"|g" application.yml
          fi

      - name: Optimize Linux Kernel Network & DNS (Ultra-Low Latency)
        run: |
          echo "Applying Linux kernel socket and network latency optimizations..."
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.somaxconn=65535 || true
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
          sudo sysctl -w net.core.netdev_max_backlog=10000 || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true
          sudo sysctl -w net.ipv4.tcp_fin_timeout=15 || true
          sudo sysctl -w net.ipv4.tcp_low_latency=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          sudo sysctl -w net.core.rmem_max=16777216 || true
          sudo sysctl -w net.core.wmem_max=16777216 || true
          sudo sysctl -w net.core.rmem_default=2097152 || true
          sudo sysctl -w net.core.wmem_default=2097152 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216" || true
          sudo sysctl -w net.ipv4.udp_rmem_min=16384 || true
          sudo sysctl -w net.ipv4.udp_wmem_min=16384 || true
          ulimit -n 65535 || true
          echo "Injecting ultra-fast Anycast DNS (Cloudflare 1.1.1.1 & Google 8.8.8.8)..."
          sudo sed -i '1i nameserver 1.1.1.1\nnameserver 1.0.0.1\nnameserver 8.8.8.8' /etc/resolv.conf || true

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          set -e
          echo "Downloading cloudflared binary directly from GitHub releases..."
          curl -sSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version
          echo "✅ cloudflared successfully installed!"

      - name: Start Lavalink Node (Java 25 + koe 3.1.0)
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
        run: |
          if [ ! -f "Lavalink.jar" ]; then
            echo "::error::Lavalink.jar not found!"
            exit 1
          fi
          echo "Starting Lavalink process..."
          nohup java \
            --enable-native-access=ALL-UNNAMED \
            --sun-misc-unsafe-memory-access=allow \
            -XX:+UseZGC \
            -Xms1G \
            -Xmx2G \
            -XX:+AlwaysPreTouch \
            -XX:+UseStringDeduplication \
            -XX:+OptimizeStringConcat \
            -XX:+UseNUMA \
            -Djava.net.preferIPv4Stack=true \
            -Djava.net.preferIPv4Addresses=true \
            -Djdk.net.hosts.resolver=SYSTEM \
            -Dnetworkaddress.cache.ttl=120 \
            -Dnetworkaddress.cache.negative.ttl=5 \
            -Dsun.net.inetaddr.ttl=120 \
            -Dsun.net.inetaddr.negative.ttl=5 \
            -Dhttp.keepAlive=true \
            -Dhttp.maxConnections=256 \
            -Dio.netty.transport.noNative=false \
            -Dio.netty.allocator.type=pooled \
            -Dio.netty.allocator.numDirectArenas=4 \
            -Dio.netty.noPreferDirect=false \
            -Dio.netty.recycler.maxCapacityPerThread=4096 \
            -jar Lavalink.jar > lavalink.log 2>&1 &
          LAVALINK_PID=$!
          echo "LAVALINK_PID=$LAVALINK_PID" >> $GITHUB_ENV
          echo "Lavalink PID: $LAVALINK_PID"
          
          sleep 4
          if ! kill -0 $LAVALINK_PID 2>/dev/null; then
            echo "::error::Lavalink process died immediately after start!"
            head -n 50 lavalink.log || echo "No log"
            exit 1
          fi
          echo "✅ Lavalink process is running (PID: $LAVALINK_PID)"
          sudo renice -n -5 -p "$LAVALINK_PID" || true
          sudo sysctl -w vm.swappiness=1 || true

      - name: Wait for Lavalink Ready
        run: |
          echo "Waiting for Lavalink initialization..."
          READY=false
          for i in {1..60}; do
            echo "Check $i/60: Looking for startup confirmation..."
            if grep -q "Lavalink is ready to accept connections" lavalink.log 2>/dev/null || grep -q "Started LauncherKt" lavalink.log 2>/dev/null; then
              echo "✅ Lavalink initialized successfully!"
              READY=true
              break
            fi
            sleep 3
          done
          if [ "$READY" = "true" ]; then
            echo "✅ Lavalink is online and listening on 127.0.0.1:4998!"
          else
            echo "::error::Lavalink startup timed out after 3 minutes!"
            tail -n 50 lavalink.log || echo "No log file found"
            exit 1
          fi

      - name: Log Lavalink Runtime Identity (/v4/info)
        run: |
          INFO=$(curl -sS --max-time 10 -H "Authorization: ${NODE_PASSWORD}" \
            http://127.0.0.1:4998/v4/info || true)
          if [ -n "$INFO" ]; then
            {
              echo ""
              echo "## Lavalink runtime identity"
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Version | \`$(echo "$INFO" | jq -r '.version.semver // (.version | tostring)')\` |"
              echo "| Git branch | \`$(echo "$INFO" | jq -r '.git.branch // "?"')\` |"
              echo "| Git commit | \`$(echo "$INFO" | jq -r '(.git.commit // "?")[0:9]')\` |"
              echo "| Lavaplayer | \`$(echo "$INFO" | jq -r '.lavaplayer // "?"')\` |"
              echo "| JVM | \`$(echo "$INFO" | jq -r '.jvm // "?"')\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start Cloudflare Tunnel (External Access)
        id: tunnel
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Starting persistent Cloudflare Named Tunnel..."
            nohup cloudflared tunnel \
              --edge-ip-version auto \
              --protocol http2 \
              --ha-connections 4 \
              --heartbeat-count 5 \
              --heartbeat-interval 5s \
              run --token "$CF_TOKEN" > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
            sleep 3
            HOST="${CF_CUSTOM_DOMAIN:-lavalink.opendrive.indevs.in}"
            echo "PUBLIC_HOST=$HOST" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=https://$HOST" >> $GITHUB_ENV
          else
            echo "Starting temporary Cloudflare Quick Tunnel..."
            nohup cloudflared tunnel \
              --protocol http2 \
              --edge-ip-version auto \
              --ha-connections 4 \
              --url http://127.0.0.1:4998 > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
            TUNNEL_URL=""
            for i in {1..30}; do
              TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9@:%._+~#=]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then break; fi
              sleep 2
            done
            HOST=$(echo "$TUNNEL_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
            echo "PUBLIC_HOST=${HOST:-127.0.0.1}" >> $GITHUB_ENV
            echo "PUBLIC_PORT=443" >> $GITHUB_ENV
            echo "PUBLIC_SECURE=true" >> $GITHUB_ENV
            echo "PUBLIC_URL=${TUNNEL_URL:-http://127.0.0.1:4998}" >> $GITHUB_ENV
          fi

      - name: Announce Lavalink Connection Details
        run: |
          echo "======================================================"
          echo "🎉 LAVALINK NODE ONLINE: 127.0.0.1:4998 (Local) | $PUBLIC_URL (Public)"
          echo "======================================================"
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 👑 Lavalink Node Active (Unified Single-Runner)
          | Parameter | Value |
          |---|---|
          | **Local Direct Host** | \`127.0.0.1:4998\` (0ms IPC latency) |
          | **Public Host** | \`${{ env.PUBLIC_HOST }}\` |
          | **Public Port** | \`${{ env.PUBLIC_PORT }}\` |
          | **Password** | \`${{ env.NODE_PASSWORD }}\` |
          | **Public URL** | \`${{ env.PUBLIC_URL }}\` |
          | **GC Engine** | Java 25 Generational ZGC (<1ms) |
          | **Session #** | \`${{ github.run_number }}\` |
          EOF

      # ========================================================================
      # 3. DISCORD BOT FLEET SETUP & PREPARATION
      # ========================================================================
      - name: Restore Bot Database & Persistent Storage Cache
        uses: actions/cache/restore@v5
        with:
          path: music-bot/data
          key: bot-persistent-v6-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-persistent-v6-${{ github.ref_name }}-

      - name: Restore Persistent Bot Data from Artifact Backup
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p music-bot/data
          mkdir -p /tmp/artifact_data
          if gh run download --name bot-backup-latest --dir /tmp/artifact_data 2>/dev/null; then
            echo "✅ Successfully downloaded bot-backup-latest artifact! Restoring data files..."
            cp -rf /tmp/artifact_data/* music-bot/data/ 2>/dev/null || true
            rm -rf /tmp/artifact_data
          else
            echo "No prior bot-backup-latest artifact found. Using fresh storage."
          fi

      - name: Install Build Tools for Native Modules
        run: |
          echo "Installing build tools..."
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 python3-pip
          npm install -g node-gyp

      - name: Install Dependencies & Rebuild Native Modules
        run: |
          cd music-bot
          echo "Installing bot dependencies..."
          if ! npm ci --prefer-offline --no-audit 2>&1; then
            echo "Regenerating lockfile..."
            rm -f package-lock.json
            npm install --package-lock-only
          fi
          npm ci --prefer-offline --no-audit
          
          echo "Rebuilding better-sqlite3 and sharp native modules..."
          rm -rf node_modules/better-sqlite3/build node_modules/better-sqlite3/prebuilds 2>/dev/null || true
          rm -rf node_modules/sharp/build node_modules/sharp/vendor 2>/dev/null || true
          npm rebuild better-sqlite3 --build-from-source
          npm rebuild sharp --build-from-source
          
          node -e "const db = require('better-sqlite3')(':memory:'); db.close(); console.log('✅ better-sqlite3 test passed')" || {
            echo "❌ better-sqlite3 test FAILED!"
            exit 1
          }
          cd ..

      - name: Register Discord Slash Commands
        run: |
          cd music-bot
          node src/deploy-commands.js || true
          cd ..

      # ========================================================================
      # 4. RUN UNIFIED 24/7 FLEET & LAVALINK WATCHDOG (5.5 HOURS)
      # ========================================================================
      - name: Run Unified 24/7 Engine (Music Bot Fleet + Local Lavalink)
        env:
          LAVALINK_HOST: "127.0.0.1"
          LAVALINK_PORT: "4998"
          LAVALINK_SECURE: "false"
          LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD || 'youshallnotpass' }}
          LAVALINK_REQUEST_TIMEOUT_MS: "25000"
          AUTO_MAXIMIZE_BITRATE: "true"
          DEFAULT_SEARCH_PLATFORM: "spsearch"
          ALLOW_METADATA_SOURCE: "true"
          STOP_ALONE_IN_247: "false"
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
          RUNNER_LIFETIME_MS: "19800000"
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
        run: |
          if [ -z "$DISCORD_TOKEN" ] && [ -z "$DISCORD_TOKENS" ]; then
            echo "::error::Neither DISCORD_TOKEN nor DISCORD_TOKENS is configured in secrets!"
            exit 1
          fi

          # Background watchdog monitoring Lavalink
          (
            while kill -0 $LAVALINK_PID 2>/dev/null; do
              sleep 15
            done
            echo "::error::Lavalink process exited unexpectedly during run!"
            tail -n 50 lavalink.log || true
          ) &
          WATCHDOG_PID=$!

          echo "=========================================================="
          echo "🚀 Starting 24/7 Discord Music Bot Fleet (Direct 127.0.0.1:4998 IPC)"
          echo "=========================================================="
          cd music-bot
          node src/sharder.js
          cd ..

          kill $WATCHDOG_PID 2>/dev/null || true

      # ========================================================================
      # 5. PERSISTENCE & DATA SYNC (ALWAYS EXECUTES ON COMPLETION)
      # ========================================================================
      - name: Flush Bot Database & Save Active Sessions
        if: always()
        run: |
          if [ -d "music-bot/data" ]; then
            echo "Flushing SQLite WAL checkpoints & syncing JSON mirrors..."
            cd music-bot
            node -e "try { const db = require('./src/database/db'); db.checkpoint(); db.exportJson(); console.log('DB Checkpoint & JSON export successful'); } catch(e){ console.log(e.message); }" || true
            cd ..
            ls -lh music-bot/data || true
          fi

      - name: Save Bot Database & Active Sessions Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: music-bot/data
          key: bot-persistent-v6-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Persistent Bot Data Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-backup-latest
          path: music-bot/data
          retention-days: 30
          overwrite: true

      - name: Commit and Push Persistent State to Repository
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd music-bot
          node -e "try { const db = require('./src/database/db'); db.checkpoint(); db.exportJson(); } catch(e){}" || true
          cd ..
          git add -f music-bot/data/*.json music-bot/data/bot.db 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No persistent data changes to commit."
          else
            echo "Committing updated persistent state..."
            git commit -m "chore(data): auto-sync bot database & active sessions [skip ci]" || true
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              git fetch --unshallow 2>/dev/null || git fetch origin ${{ github.ref_name }} || true
              if git -c rebase.autoStash=true rebase -X ours origin/${{ github.ref_name }}; then
                if git push https://x-access-token:${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}; then
                  echo "✅ Persistent state pushed successfully!"
                  break
                fi
              else
                git rebase --abort || true
                git -c rebase.autoStash=true pull --rebase origin ${{ github.ref_name }} || true
                if git push https://x-access-token:${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}; then
                  echo "✅ Persistent state pushed successfully after rebase!"
                  break
                fi
              fi
              sleep 3
            done
          fi

      # ========================================================================
      # 6. SELF-HEALING 24/7 RE-DISPATCHER (NEXT SESSION)
      # ========================================================================
      - name: Self-Healing 24/7 Re-dispatcher
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN || github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f ".workflow_cancelled" ]; then
            echo "🛑 Cancellation marker found. Skipping auto-restart."
            exit 0
          fi
          
          echo "Checking for active runs before scheduling next session..."
          runs="$(gh api "repos/${GH_REPOSITORY}/actions/workflows/main.yml/runs?per_page=10" || echo '{"workflow_runs":[]}')"
          active="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id | tostring) != $current) | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          
          if [ "$active" -gt 0 ]; then
            echo "⏭️ Another session is already queued/running. Skipping duplicate dispatch."
          else
            echo "🚀 Dispatching next 24/7 session on branch: $BRANCH..."
            gh api --method POST \
              "repos/${GH_REPOSITORY}/actions/workflows/main.yml/dispatches" \
              -f ref="$BRANCH"
            echo "✅ Next 24/7 session dispatched successfully!"
          fi

      - name: Cleanup Background Processes
        if: always()
        run: |
          echo "Terminating any background services..."
          kill -9 $LAVALINK_PID 2>/dev/null || true
          kill -9 $TUNNEL_PID 2>/dev/null || true
