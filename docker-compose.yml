# NOTE: The live 24/7 node is deployed by .github/workflows/main.yml on a
# GitHub Actions runner (not by this file). This compose file is kept for a
# Docker/VPS deployment.
#
# The DAVE send-path stall (lavalink-devs/Lavalink#1222, heard as constant
# crackle) is fixed by koe 3.1.0, which NO published Lavalink image ships yet:
# `dev` still pins koe 3.0.0 and PR #1235 is unmerged. The workflow builds that
# PR head itself; an image pulled here will still crackle until upstream
# releases it. Set LAVALINK_IMAGE to a tag that contains koe 3.1.0 once one
# exists.
version: "3.8"

services:
  lavalink:
    # Upstream Lavalink `dev`. It still ships koe 3.0.0, which has the DAVE
    # send-path stall (lavalink-devs/Lavalink#1222 - constant crackle), so this
    # image is only a placeholder for a VPS deployment until a tag with koe
    # 3.1.0 is published; override with LAVALINK_IMAGE once it is.
    image: ${LAVALINK_IMAGE:-ghcr.io/lavalink-devs/lavalink:dev}
    container_name: lavalink
    restart: unless-stopped
    environment:
      # The image entrypoint is exec-form (`java -jar ...`), so JAVA_OPTS is
      # never read. JAVA_TOOL_OPTIONS is picked up by the JVM itself.
      # -XX:+ZGenerational was removed in JDK 24; ZGC is generational by default.
      - JAVA_TOOL_OPTIONS=-XX:+UseZGC -Xms2G -Xmx2G -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -Dio.netty.transport.noNative=false -Dio.netty.allocator.type=pooled -Dio.netty.allocator.numDirectArenas=4 -Dio.netty.recycler.maxCapacityPerThread=4096 -Dnetworkaddress.cache.ttl=300 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true -Djdk.net.hosts.resolver=SYSTEM
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - PLUGINS_YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins:ro
    ports:
      - "4998:4998"
    healthcheck:
      # alpine has no curl/wget guarantees; busybox nc confirms the port is open
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4998 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --protocol http2 --edge-ip-version auto --ha-connections 4 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      lavalink:
        condition: service_healthy
