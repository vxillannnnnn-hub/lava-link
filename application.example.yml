# ==============================================================================
# Lavalink v4 node configuration - CANONICAL (this is the file that runs)
# ==============================================================================
# Read by docker-compose.yml (mounted at /opt/Lavalink/application.yml) and by
# .github/workflows/main.yml, which only falls back to application.example.yml
# when this file is missing.
#
# music-bot/lavalink/application.yml is the local-node copy and repeats every
# audio setting in this file. Change a buffer, encoder, resampler, threshold,
# source or filter here and change it there too, or a node tested locally will
# not behave like the node that serves users.
#
# - Multi-source support: YouTube, Spotify, Deezer, JioSaavn, SoundCloud, etc.
# - Spotify uses internal GraphQL (NO Spotify Developer App or Premium required!)
# ==============================================================================

server:
    address: 0.0.0.0
    port: 4998 # Set your desired server port
    http2:
        enabled: false
    undertow:
        buffer-size: 16384
        direct-buffers: true
        io-threads: 4
        no-request-timeout: 60000
        worker-threads: 64
        options:
            socket:
                TCP_NODELAY: true
                BACKLOG: 2048
                REUSE_ADDRESSES: true
            server:
                ALWAYS_SET_KEEP_ALIVE: true
                RECORD_REQUEST_START_TIME: false

koe:
    useEpoll: true # Linux native C-epoll network transport (lowest UDP voice latency)
    useKQueue: false
    highPacketPriority: true # Real-time scheduling priority for Discord voice frames
    bufferDurationMs: 1000 # Native audio queue: a full second absorbs GC/scheduler/network spikes (adds ~0.6s latency, removes underrun crackle)
    byteBufAllocator: "pooled" # Netty pooled off-heap direct buffers

lavalink:
    plugins: [] # Loads pre-bundled local JARs from ./plugins
    pluginsDir: "./plugins"
    server:
        password: "YOUR_LAVALINK_PASSWORD" # Change this password
        bufferDurationMs: 1000 # JDA-NAS queue for GC/scheduler spikes (~0.6s added latency). It cannot mask the DAVE send-path stall (#1222) - that is a koe build issue
        frameBufferDurationMs: 5000 # Pre-buffered frames: 5.0s prevents stuttering during internet packet loss
        playerUpdateInterval: 5 # Lavalink's default. 2/s per player doubles WS traffic for nothing
        opusEncodingQuality: 10 # Transcode-only: best VBR Opus fidelity, no effect on passthrough
        resamplingQuality: MEDIUM # Transcode-only. HIGH costs several times the CPU per resampled player, and CPU starvation is what drops frames
        trackStuckThresholdMs: 10000 # 10s. A lower value skips slow-starting tracks and is heard as the song cutting out
        useSeekGhosting: true # Keep reading buffered audio until the seek target is ready: no silent gap on /seek
        nonAllocatingFrameBuffer: false # Documented default. `true` cuts allocations but makes frame rebuilding non-instantaneous, so live volume/EQ changes land late
        gc-warnings: true # Log JVM pause warnings so node-side stutter is diagnosable
        youtubePlaylistLoadLimit: 6 # Pages of a YouTube playlist to load
        koe:
            useEpoll: true
            useKQueue: false
            highPacketPriority: true
            bufferDurationMs: 1000
            byteBufAllocator: "pooled"
        youtubeSearchEnabled: false # Handled via dev.lavalink.youtube
        soundcloudSearchEnabled: true
        sources:
            youtube: false # Handled by dev.lavalink.youtube plugin
            soundcloud: true
            bandcamp: true
            twitch: true
            vimeo: true
            http: true # (`nico` was a v3-era source and a no-op in v4 - dropped)
            local: false
        filters:
            volume: true
            equalizer: true
            karaoke: true
            timescale: true
            tremolo: true
            vibrato: true
            distortion: true
            rotation: true
            channelMix: true
            lowPass: true

plugins:
    # --------------------------------------------------------------------------
    # YouTube Plugin (dev.lavalink.youtube)
    # --------------------------------------------------------------------------
    youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
            # Opus-capable clients only. IOS / ANDROID / TV return no Opus music
            # format, so a track loaded through them is decoded and re-encoded -
            # the second lossy generation this whole config exists to avoid.
            - MUSIC # The only client that understands `ytmsearch:`; 256kbps Opus master
            - ANDROID_MUSIC # Secondary high-bitrate audio client
            - ANDROID_VR # Bot-detection evasion fallback
            - TVHTML5_SIMPLY
            - WEB
            - MWEB
            - WEBEMBEDDED # Playback for age-restricted / embed-only tracks
        clientOptions:
            MUSIC:
                playback: true
                searching: true
            ANDROID_MUSIC:
                playback: true
                searching: true
            ANDROID_VR:
                playback: true
                searching: true
            TVHTML5_SIMPLY:
                playback: true
                searching: true
            # WEB is SABR-gated: when YouTube answers its /player request with only
            # SABR-gated adaptive formats, the plugin falls back to muxed itag 18,
            # which lacks contentLength and fails to decode ("Expected decoding
            # to halt, got: 5" / Audio decode failure at 0 ms). Keep WEB for search
            # metadata only and let the non-SABR clients carry playback.
            WEB:
                playback: false
                searching: true
            MWEB:
                playback: true
                searching: true
            WEBEMBEDDED:
                playback: true
                searching: true
        oauth:
            enabled: true
            skipInitialization: false
            refreshToken: ""
        remoteCipher:
            url: "https://cipher.kikkia.dev"
            userAgent: "yt-source"

    # --------------------------------------------------------------------------
    # LavaSrc Plugin (Spotify / Deezer)
    # --------------------------------------------------------------------------
    lavasrc:
        sources:
            spotify: false # Handled by SolaceAudio
            applemusic: false
            deezer: false
            yandexmusic: false
            flowerytts: false
            youtube: false
        providers:
            - "ytmsearch:\"%ISRC%\""
            - "ytmsearch:%QUERY%"
            - "ytsearch:%QUERY%"
            - "jssearch:%QUERY%"
        lyrics-sources:
            spotify: true
            youtube: true
            deezer: false
        spotify:
            clientId: "YOUR_SPOTIFY_CLIENT_ID"
            clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"
            spDc: "YOUR_SPOTIFY_SP_DC_COOKIE"
            countryCode: "IN"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            resolveArtistsInSearch: true
            localFiles: false

    # --------------------------------------------------------------------------
    # SolaceAudio Plugin (Spotify & Indian Streaming - FULL LENGTH AUDIO)
    # --------------------------------------------------------------------------
    solaceaudio:
        sources:
            spotify: true # Enabled! Bypasses Spotify Developer / Premium restrictions
            jiosaavn: true
            gaana: false
            amazonmusic: false
            deezer: false # Disabled: Deezer preview is strictly 30s clips without premium keys
            pandora: false
            youtube: false
            flowerytts: false
        providers:
            - "ytmsearch:\"{isrc}\""
            - "ytmsearch:{query}"
            - "ytsearch:{query}"
            - "jssearch:{query}"
        spotify:
            countryCode: "IN"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            resolveArtistsInSearch: true
            localFiles: false
            spDc: "YOUR_SPOTIFY_SP_DC_COOKIE"
        deezer:
            apiUrl: "https://deezer-plugin-api.vercel.app/api"
            playlistLoadLimit: 50
            albumLoadLimit: 50
            artistLoadLimit: 50
            searchLimit: 50

    # --------------------------------------------------------------------------
    # LavaSearch Plugin (com.github.topi314.lavasearch)
    # --------------------------------------------------------------------------
    lavasearch:
        sources:
            youtube: true
            spotify: true
            deezer: false
            soundcloud: true

logging:
    file:
        path: ./logs/
    level:
        com.solaceaudio: INFO
        lavalink: INFO
        moe.kyokobot.koe: INFO
        root: INFO
    logback:
        rollingPolicy:
            maxFileSize: 1GB
            maxHistory: 30
    request:
        enabled: true
        includeClientInfo: true
        includeHeaders: false
        includePayload: true
        includeQueryString: true
        maxPayloadLength: 10000

metrics:
    prometheus:
        enabled: true
        endpoint: /metrics

sentry:
    dsn: ""
    environment: ""
